<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Church — Events & Groups</title>
  <style>
    :root { --navy:#1a2744; --gold:#c9a227; --bg:#f7f5f0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--navy); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .card { width:100%; max-width:420px; background:#fff; border-radius:1rem; padding:2rem 1.5rem; box-shadow:0 8px 30px rgba(26,39,68,.12); text-align:center; }
    h1 { margin:0 0 .35rem; font-size:1.55rem; letter-spacing:.04em; }
    p { margin:0 0 1.5rem; color:#556; font-size:1rem; }
    a.btn { display:block; width:100%; text-decoration:none; color:#fff; background:var(--navy); padding:1rem 1.25rem; border-radius:.75rem; font-weight:700; font-size:1.05rem; margin-bottom:.85rem; }
    a.btn.secondary { background:#fff; color:var(--navy); border:2px solid var(--navy); }
    a.btn:active { opacity:.9; }
    .note { margin-top:1rem; font-size:.8rem; color:#888; }
  </style>
</head>
<body>
  <main class="card">
    <h1>LIFE CHURCH</h1>
    <p>Choose where you want to go</p>
    <a class="btn" href="https://www.lifechurchnow.com/events">Upcoming Events</a>
    <a class="btn secondary" href="https://www.lifechurchnow.com/life-groups">LC Groups (Small Groups)</a>
    <p class="note">lifechurchnow.com</p>
  </main>
</body>
</html>
