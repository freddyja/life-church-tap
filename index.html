<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Church Spring Hill</title>
  <style>
    :root { --navy:#1a2744; --gold:#c9a227; --bg:#f7f5f0; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--navy);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      margin: auto;
      background: #fff;
      border-radius: 1rem;
      padding: 2rem 1.5rem 1.5rem;
      box-shadow: 0 8px 30px rgba(26,39,68,.12);
      text-align: center;
    }
    .logo {
      width: 84px;
      height: 84px;
      border-radius: 14px;
      margin: 0 0 1rem;
    }
    h1 {
      margin: 0;
      font-size: 1.55rem;
      letter-spacing: .04em;
    }
    .campus {
      margin: .15rem 0 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .lead {
      margin: .9rem 0 1.35rem;
      color: #556;
      font-size: 1rem;
    }
    a.btn {
      display: block;
      width: 100%;
      text-decoration: none;
      color: #fff;
      background: var(--navy);
      padding: 1rem 1.25rem;
      border-radius: .75rem;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: .85rem;
    }
    a.btn:active { opacity: .9; }
    .groups {
      margin: 0 0 .85rem;
      padding: .85rem .85rem .35rem;
      border: 2px solid var(--navy);
      border-radius: .75rem;
      text-align: left;
    }
    .groups h2 {
      margin: 0 0 .65rem;
      font-size: 1.05rem;
      text-align: center;
    }
    .groups a {
      display: block;
      text-decoration: none;
      color: var(--navy);
      background: #fff;
      border: 2px solid var(--navy);
      border-radius: .65rem;
      padding: .8rem 1rem;
      font-weight: 700;
      font-size: .98rem;
      margin-bottom: .55rem;
      text-align: center;
    }
    .groups a:active { opacity: .9; }
    .note {
      margin: .35rem 0 0;
      font-size: .8rem;
      color: #888;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/life-church-lc-logo.png" width="84" height="84" alt="Life Church" />
    <h1>LIFE CHURCH</h1>
    <p class="campus">Spring Hill</p>
    <p class="lead">Upcoming events, groups, and ways to give.</p>
    <a class="btn" href="https://www.lifechurchnow.com/events">Upcoming Events</a>
    <section class="groups" aria-labelledby="groups-heading">
      <h2 id="groups-heading">Spring Hill Groups</h2>
      <a href="https://lifechurchwc.churchcenter.com/groups/growing-closer?campuses%5B%5D=18074">Growing Closer</a>
      <a href="https://lifechurchwc.churchcenter.com/groups/growing-deeper?campuses%5B%5D=18074">Growing Deeper</a>
      <a href="https://lifechurchwc.churchcenter.com/groups/growing-stronger?campuses%5B%5D=18074">Growing Stronger</a>
      <a href="https://lifechurchwc.churchcenter.com/groups/growing-up?campuses%5B%5D=18074">Growing Up</a>
    </section>
    <a class="btn" href="https://www.lifechurchnow.com/give">Ways to Give</a>
    <p class="note">Spring Hill campus</p>
  </main>
</body>
</html>
